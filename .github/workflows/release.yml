name: Release Multi-Platform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Dependencies (Ubuntu Only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Svelte 5 Frontend
        run: npm run build

      - name: Build Tauri Desktop App & Bundle Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'POS Kasir Desktop v__VERSION__'
          releaseBody: |
            ## Rilis Resmi POS Kasir Desktop v__VERSION__
            
            Sistem POS Kasir Retail & Grosir Terpadu Multi-Cabang (Tauri v2 + Svelte 5 + SQLite WAL).
            
            ### Paket Installer Tersedia:
            - **Windows (10/11 x64)**: `POS Kasir Desktop___VERSION___x64-setup.exe` (NSIS Installer)
            - **Linux Debian / Ubuntu (.deb)**: `pos-kasir-desktop___VERSION___amd64.deb`
            - **Linux Fedora / RHEL (.rpm)**: `pos-kasir-desktop-___VERSION___.x86_64.rpm`
            - **Linux Universal Portable**: `pos-kasir-desktop____VERSION____amd64.AppImage`
            - **macOS Universal (.dmg)**: `POS Kasir Desktop____VERSION____universal.dmg` (Intel & Apple Silicon M1/M2/M3/M4)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
